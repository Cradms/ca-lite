name: CaLite
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# 无小组件版本：给自签（AltStore / Sideloadly / 爱思）用。
# 自签会重签 .appex 并丢掉 App Group，小组件必然失效，所以这个版本直接不带扩展。
targets:
  CaLite:
    type: application
    platform: iOS
    sources:
      - path: CaLite
    settings:
      base:
        INFOPLIST_FILE: CaLite/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.ursaminor4185.leo8046
        PRODUCT_NAME: CaLite
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CaLite/CaLite.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
