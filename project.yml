name: CaLite
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  CaLite:
    type: application
    platform: iOS
    sources:
      - path: CaLite
    settings:
      base:
        INFOPLIST_FILE: CaLite/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.calite
        PRODUCT_NAME: CaLite
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CaLite/CaLite.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
    dependencies:
      - target: CaLiteWidget
        embed: true

  CaLiteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CaLiteWidget
    settings:
      base:
        INFOPLIST_FILE: CaLiteWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.calite.widget
        PRODUCT_NAME: CaLiteWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CaLiteWidget/CaLiteWidget.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
