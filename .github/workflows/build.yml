name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check signing secrets
        id: sign
        env:
          P12: ${{ secrets.P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Import certificate
        if: steps.sign.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo "$P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings -lut 3600 $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain
          if [ -n "$PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          fi

      - name: Archive (signed)
        if: steps.sign.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -e
          python3 gen_export_options.py "com.yg.calite" "$TEAM_ID" "ad-hoc" ""
          xcodebuild archive \
            -project CaLite.xcodeproj -scheme CaLite -configuration Release \
            -sdk iphoneos -archivePath "$PWD/build/CaLite.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual | tail -30
          xcodebuild -exportArchive -archivePath "$PWD/build/CaLite.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/build/ipa" | tail -20

      - name: Build unsigned
        if: steps.sign.outputs.signed == 'false'
        run: |
          set -e
          xcodebuild -project CaLite.xcodeproj -scheme CaLite -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          mkdir -p build/ipa Payload
          cp -R build/Build/Products/Release-iphoneos/CaLite.app Payload/
          zip -qry build/ipa/CaLite-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CaLite-ipa
          path: build/ipa/*.ipa
          retention-days: 30
