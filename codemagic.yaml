workflows:
  # ---------------- 未签名：直接出 ipa，自己签 ----------------
  ca-lite-unsigned:
    name: CA Lite · 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.calite
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        script: |
          set +e
          set -o pipefail
          xcodebuild \
            -project CaLite.xcodeproj \
            -scheme CaLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log | tail -40
          rc=$?
          echo ""
          echo "================ 编译错误汇总 ================"
          grep -n "error:" /tmp/build.log | head -40
          echo "=============================================="
          echo "退出码: $rc"
          exit $rc

      - name: 打包 IPA
        script: |
          set -e
          APP=$(find build -name "*.app" -maxdepth 5 -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ 没找到 .app，编译可能失败"
            tail -80 /tmp/build.log || true
            exit 1
          fi
          rm -rf Payload CaLite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CaLite-unsigned.ipa Payload
          unzip -l CaLite-unsigned.ipa | head -8
          ls -lh CaLite-unsigned.ipa
    artifacts:
      - CaLite-unsigned.ipa

  # ---------------- 已签名（Ad Hoc）：用你的 Apple Distribution 证书 ----------------
  # 前置（在你的开发者账号后台完成）：
  #   1) Identifiers 里要有 App ID = com.yg.calite（要和 project.yml 的 Bundle ID 一致）
  #   2) Profiles 新建一个 Ad Hoc 描述文件：绑 com.yg.calite + 证书 + 设备 UDID
  #   3) 钥匙串导出该证书的 .p12（必须带私钥）
  #   4) Codemagic → 项目 → Code signing identities 上传：1 个 p12 + 1 个 mobileprovision
  ca-lite-signed:
    name: CA Lite · 已签名 IPA (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.calite
        TEAM_ID: K4M82K8J22
        EXPORT_METHOD: ad-hoc
        CERT_NAME: Apple Distribution
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          xcodegen generate
          echo "---- Bundle ID ----"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" project.yml

      - name: 检查签名材料
        script: |
          echo "======== 签名材料检查 ========"
          P12N=$(ls ~/Library/Developer/Xcode/UserData/Certificates/*.p12 2>/dev/null | wc -l)
          PRON=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | wc -l)
          echo "p12 = $P12N 个, profile = $PRON 个"
          if [ "$P12N" -eq 0 ]; then
            echo "!! 没有 p12：Codemagic → Code signing identities → Distribution certificates 上传"
            exit 1
          fi
          if [ "$PRON" -eq 0 ]; then
            echo "!! 没有描述文件：同一页 → Provisioning profiles 上传 Ad Hoc profile"
            exit 1
          fi
          echo "---- 已上传的 profile 列表 ----"
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "文件: $(basename "$f")"
            security cms -D -i "$f" 2>/dev/null | /usr/libexec/PlistBuddy \
              -c "Print :Name" -c "Print :UUID" -c "Print :ProvisionedDevices" /dev/stdin 2>/dev/null | head -6 || true
          done
          echo "=============================="

      - name: 导入证书
        script: |
          set -eo pipefail
          keychain initialize
          keychain add-certificates
          # 给所有 target 按 bundle id 自动匹配 profile
          xcode-project use-profiles
          echo "---- 当前签名设置 ----"
          grep -rn "PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_IDENTITY" CaLite.xcodeproj/project.pbxproj | head -6 || true

      - name: 归档并导出 IPA
        script: |
          set -eo pipefail
          PB=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          PROF_NAME=$(security cms -D -i "$PB" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          echo "使用描述文件: $PROF_NAME"

          python3 gen_export_options.py "$BUNDLE_ID" "$TEAM_ID" "$EXPORT_METHOD" "$PROF_NAME" "$CERT_NAME"
          cat ExportOptions.plist

          xcodebuild archive \
            -project CaLite.xcodeproj \
            -scheme CaLite \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/CaLite.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | tail -40

          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/CaLite.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/ipa" \
            | tail -30
          ls -lh build/ipa
    artifacts:
      - build/ipa/*.ipa
