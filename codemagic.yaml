workflows:
  # ---------------- 未签名：直接出 ipa，自己签 ----------------
  ca-lite-unsigned:
    name: CA Lite · 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.calite
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        script: |
          set +e
          set -o pipefail
          xcodebuild \
            -project CaLite.xcodeproj \
            -scheme CaLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log | tail -40
          rc=$?
          echo ""
          echo "================ 编译错误汇总 ================"
          grep -n "error:" /tmp/build.log | head -40
          echo "=============================================="
          echo "退出码: $rc"
          exit $rc

      - name: 打包 IPA
        script: |
          set -e
          APP=$(find build -name "*.app" -maxdepth 5 -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ 没找到 .app，编译可能失败"
            tail -80 /tmp/build.log || true
            exit 1
          fi
          rm -rf Payload CaLite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CaLite-unsigned.ipa Payload
          unzip -l CaLite-unsigned.ipa | head -8
          ls -lh CaLite-unsigned.ipa
    artifacts:
      - CaLite-unsigned.ipa

  # ---------------- 已签名：在 Codemagic 上传 p12 + profile 后用 ----------------
  ca-lite-signed:
    name: CA Lite · 已签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.yg.calite
      vars:
        BUNDLE_ID: com.yg.calite
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          xcodegen generate

      - name: 应用签名配置
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: 出签名 IPA
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project CaLite.xcodeproj \
            --scheme CaLite \
            --config Release
          ls -lh build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
