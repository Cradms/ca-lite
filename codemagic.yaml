workflows:
  # ---------------- 未签名：直接出 ipa，自己签 ----------------
  ca-lite-unsigned:
    name: CA Lite · 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.calite
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        script: |
          set +e
          set -o pipefail
          xcodebuild \
            -project CaLite.xcodeproj \
            -scheme CaLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log | tail -40
          rc=$?
          echo ""
          echo "================ 编译错误汇总 ================"
          grep -n "error:" /tmp/build.log | head -40
          echo "=============================================="
          echo "退出码: $rc"
          exit $rc

      - name: 打包 IPA
        script: |
          set -e
          APP=$(find build -name "*.app" -maxdepth 5 -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ 没找到 .app，编译可能失败"
            tail -80 /tmp/build.log || true
            exit 1
          fi
          rm -rf Payload CaLite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CaLite-unsigned.ipa Payload
          unzip -l CaLite-unsigned.ipa | head -8
          ls -lh CaLite-unsigned.ipa
    artifacts:
      - CaLite-unsigned.ipa

  # ---------------- 已签名：手动上传 p12 + 两个 profile 后跑这条 ----------------
  # 前置：
  #   1) Apple Developer（付费账号）建 App ID：com.yg.calite 与 com.yg.calite.widget
  #   2) App Groups 建 group.com.yg.calite，并在两个 App ID 里启用
  #   3) Certificates 生成 Apple Distribution，导出 .p12
  #   4) Profiles 建两个 Ad Hoc profile（各绑一个 App ID，勾选设备）
  #   5) Codemagic → 项目 → Code signing identities 上传 1 个 p12 + 2 个 mobileprovision
  ca-lite-signed:
    name: CA Lite · 已签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.calite
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          xcodegen generate
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" project.yml

      - name: 检查签名材料
        script: |
          echo "======== 证书与描述文件检查 ========"
          echo "-- p12 --"
          ls -la ~/Library/Developer/Xcode/UserData/Certificates/ 2>&1 || true
          ls -la ~/Library/MobileDevice/Certificates/ 2>&1 || true
          echo "-- profiles --"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || true
          P12N=$(ls ~/Library/Developer/Xcode/UserData/Certificates/*.p12 2>/dev/null | wc -l)
          PRON=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | wc -l)
          echo "统计: p12=$P12N 个, profile=$PRON 个"
          if [ "$P12N" -eq 0 ]; then
            echo "!! 没有 p12：去 Codemagic 项目 → Code signing identities 上传 .p12"
            exit 1
          fi
          if [ "$PRON" -lt 2 ]; then
            echo "!! profile 少于 2 个：com.yg.calite 和 com.yg.calite.widget 各要一个"
          fi
          echo "===================================="

      - name: 导入证书与描述文件
        script: |
          set -eo pipefail
          keychain initialize
          keychain add-certificates
          # 为所有 target（含 CaLiteWidget）按 bundle id 匹配 profile
          xcode-project use-profiles
          echo "---- 已应用的签名设置 ----"
          xcode-project list-profiles 2>/dev/null || true

      - name: 出签名 IPA
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project CaLite.xcodeproj \
            --scheme CaLite \
            --config Release
          ls -lh build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
